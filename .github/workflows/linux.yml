name: Linux build

on:
  push:
    branches: [main]
    paths: ['bale_desktop/**', 'packaging/**', '.github/workflows/linux.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Attach the build to this existing release tag (e.g. v0.2.6)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage and .deb
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zsync > /dev/null   # AppImageUpdate delta file
          python3 packaging/build_appimage.py
          python3 packaging/build_deb.py
          ls -la dist

      - name: AppImage without GTK/WebKit explains what to install
        run: |
          set +e
          out=$(APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage 2>&1); code=$?
          echo "$out"
          test $code -eq 1 && echo "$out" | grep -q 'gir1.2-webkit2-4.1'

      - name: AppImage runs with system GTK/WebKit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb dbus-x11 > /dev/null
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 15 xvfb-run -a dbus-run-session -- ./dist/*.AppImage --demo; code=$?
          echo "exit $code"
          test $code -eq 124   # still running when the timeout stopped it

      - uses: actions/upload-artifact@v4
        with:
          name: bale-desktop-linux
          path: dist/*

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.AppImage dist/*.zsync dist/*.deb --clobber
